backbone:
  type: ffs-based
  foundation_root: /data/jsy/Fast-FoundationStereo
  checkpoint_path: /data/jsy/Fast-FoundationStereo/weights/20-30-48/model_best_bp2_serialize.pth
  feature_names: [feat_04, feat_32, disp]
  freeze: true
  valid_iters: 4
  max_disp: 192
  optimize_build_volume: pytorch1

dataset:
  type: robotwin-stereo-lerobot
  root: /data/jsy/Fast-FoundationStereo/lerobot_dataset_clean
  image_size: [256, 320]
  camera_pairs:
    - [observation.images.head_camera_left, observation.images.head_camera_right]
    - [observation.images.front_camera_left, observation.images.front_camera_right]
    # - [observation.images.left_camera_left, observation.images.left_camera_right]
    # - [observation.images.right_camera_left, observation.images.right_camera_right]
  action_normalization:
    method: quantile
    normalize_indices: [0, 1, 2, 8, 9, 10]
    stats:
      q01: [-0.03120909258723259, -0.06520890444517136, -0.0009331027395091951, 0.957804262638092, -0.04635748639702797, -0.005277806427329779, -0.043041497468948364, 0.0, -0.03639077767729759, -0.0006847904878668487, -0.0012572933919727802, 0.9542942047119141, -0.0005909204483032227, -0.006055351346731186, -0.059804659336805344, 0.0]
      q99: [0.08293195068836212, 0.00038992761983536184, 0.06834829598665237, 1.0, 0.001792803406715393, 0.2803484797477722, 0.060310665518045425, 1.0, 0.10343658179044724, 0.0697120949625969, 0.08555547147989273, 1.0, 0.04566377401351929, 0.2953159213066101, 0.03881560266017914, 1.0]

policy:
  num_history_frames: 2
  action_horizon: 8
  action_dim: 16
  state_dim: 16

adapter:
  type: spatial_query
  feature_names: auto
  token_dim: 256
  queries_per_feature: 2
  num_heads: 8

head:
  type: rdt
  mlp:
    hidden_dim: 512
    num_blocks: 10
    dropout: 0.0
  rdt:
    hidden_size: 256
    depth: 4
    num_heads: 8
    num_kv_heads: 8
    norm_eps: 1.0e-5
    multiple_of: 256
    ffn_dim_multiplier:
    use_flash_attn: true
    num_register_tokens: 4
    num_inference_steps: 10
    sample_init: zeros
    act_adaptor: mlp3x_silu
    state_adaptor: mlp3x_silu
    vision_adaptor: linear
    dtype: float32

train:
  output_dir: outputs/rdt_v1
  epochs: 100
  epoch_every_n_steps:
  batch_size: 2
  num_workers: 4
  lr: 3e-4
  weight_decay: 1.0e-6
  scheduler_type: cosine
  warmup_steps: 500
  num_cycles: 0.5
  amp: true
  log_interval: 50
  save_ckpt_interval: 3000
  resume_from:

visualization:
  query_attention:
    enabled: false
    mode: all
    sources: all
    view: all
    time: -1
    query: all
    fps: 10
    alpha: 0.45
    max_frames: 200
