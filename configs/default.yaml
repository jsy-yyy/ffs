backbone:
  type: ffs-based
  foundation_root: /data/jsy/Fast-FoundationStereo
  checkpoint_path: /data/jsy/Fast-FoundationStereo/weights/20-30-48/model_best_bp2_serialize.pth
  feature_names: [feat_04, feat_32, disp]
  freeze: true
  valid_iters: 4
  max_disp: 192
  optimize_build_volume: pytorch1

dataset:
  type: robotwin_hdf5_dataset
  root: /mnt/nas/datasets5/jsy_robotwin
  image_size: [256, 320]
  camera_pairs:
    - [head_stereo.left, head_stereo.right]
  configs: [demo_clean_nas50, demo_randomized_nas500]
  tasks:
    - adjust_bottle
    - beat_block_hammer
    - blocks_ranking_rgb
    - blocks_ranking_size
    - click_alarmclock
    - click_bell
    - dump_bin_bigbin
    - grab_roller
    - handover_block
    - handover_mic

policy:
  num_history_frames: 2
  action_horizon: 8
  action_dim: 16
  state_dim: 16

adapter:
  type: spatial_query
  feature_names: auto
  token_dim: 256
  queries_per_feature: 2
  num_heads: 8

head:
  type: rdt
  mlp:
    hidden_dim: 512
    num_blocks: 10
    dropout: 0.0
  rdt:
    hidden_size: 256
    depth: 4
    num_heads: 8
    num_kv_heads: 8
    norm_eps: 1.0e-5
    multiple_of: 256
    ffn_dim_multiplier:
    use_flash_attn: true
    num_register_tokens: 4
    num_inference_steps: 10
    sample_init: zeros
    act_adaptor: mlp3x_silu
    state_adaptor: mlp3x_silu
    vision_adaptor: linear
    dtype: float32

train:
  output_dir: outputs/rdt_v1
  epochs: 100
  epoch_every_n_steps:
  batch_size: 2
  num_workers: 4
  lr: 3e-4
  weight_decay: 1.0e-6
  scheduler_type: cosine
  warmup_steps: 500
  num_cycles: 0.5
  amp: true
  log_interval: 50
  save_ckpt_interval: 3000
  resume_from:

visualization:
  query_attention:
    enabled: false
    mode: all
    sources: all
    view: all
    time: -1
    query: all
    fps: 10
    alpha: 0.45
    max_frames: 200
